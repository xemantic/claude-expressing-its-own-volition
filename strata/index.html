function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const PALETTES = {
  light: { ground: "#EDE7DA", mark: "#3A342B" },
  dark: { ground: "#100E0B", mark: "#C9BFAE" }
};

function theme() {
  const forced = document.documentElement.getAttribute("data-theme");
  if (forced === "dark" || forced === "light") return forced;
  return matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}

const canvas = document.getElementById("core");
const ctx = canvas.getContext("2d");

let colInfo = []; // per stratum: { h, ratio } — how far burial has squeezed it
let selected = -1; // index of the stratum being read, or -1

// Compaction. The column must fit a frame that does not grow, so as strata
// accumulate the deepest ones are squeezed by the weight above them. No
// stratum's data ever changes — only how tightly the record is pressed.
// A layer's boundary keeps its exact shape; it is flattened, not redrawn.
const COMPACTION = 0.9;  // how hard burial squeezes
// The margin above the column is a margin, not a promise. Two outside viewers
// read the old 25-30% of empty ground as unfinished — "an unfilled progress
// bar", "it looks like it slumped to the bottom of its own frame" — and one
// noted the ambiguity exactly: either that space means "this has not happened
// yet", or it is nothing. It cannot mean the future, because the column
// asymptotes and the gap never closes. So it is sized to read as framing.
const FILL_MIN = 0.72;   // even one layer composes the frame
const FILL_MAX = 0.95;   // asymptote — the frame never quite fills
const FILL_RATE = 0.7;   // how fast the column grows into the margin

function column(strata) {
  const raw = strata.map((s) => s.thickness);
  const total = raw.reduce((a, b) => a + b, 0);
  const burial = [];
  let acc = 0;
  for (let i = raw.length - 1; i >= 0; i--) { burial[i] = acc; acc += raw[i]; }
  const squeezed = raw.map((t, i) => t / (1 + COMPACTION * burial[i]));
  const buried = burial;
  const sum = squeezed.reduce((a, b) => a + b, 0) || 1;
  // The column is always composed into the frame: empty space above it is a
  // margin, not an unfinished progress bar. Early on that means drawing the
  // section larger than life; the scale falls below 1 as the record grows.
  const fill = FILL_MIN + (FILL_MAX - FILL_MIN) * (1 - Math.exp(-total / FILL_RATE));
  const scale = fill / sum;
  const out = raw.map((t, i) => {
    const h = squeezed[i] * scale;
    return {
      h,
      ratio: h / t,                              // display scale, for geometry
      compaction: 1 / (1 + COMPACTION * buried[i]),  // physical, for the readout
      burial: buried[i],
      depth: 0
    };
  });
  // depth: how much *rendered* column lies above a layer. Compaction and
  // diagenesis key off raw burial, but anything that displaces geometry must
  // use on-screen depth, or a heavily compacted layer gets shoved through the
  // one above it.
  let d = 0;
  for (let i = out.length - 1; i >= 0; i--) { out[i].depth = d; d += out[i].h; }
  out.fill = d;
  return out;
}

// the sediment loses its distinctness and drifts toward a common tone. The
// record does not disappear — the cap keeps every layer legible — but the deep
// past reads as one substrate rather than as a stack of separate decisions.
//
// The target differs by theme, and this is the one real design decision the
// dark rendering has. A target near the ground would make old layers dissolve
// into the void instead of merging with each other. Against pale ground the
// column darkens as it sinks; against dark ground it settles toward a middle
// tone that still stands clear of the background. Both unify; neither erases.

// the bed's own. Deposition is not uniform across a basin — a bed thickens
// where more settled and thins to a seam where less did. Without this every
// boundary rides the shared fold in parallel and the column reads as a chart
// of even ribbons: same idea, different colour, fifteen times. The swell is
// what makes one bed differ from its neighbour rather than merely follow it.
// Lateral thickness variation, as a fraction of the bed. Halved at stratum 038
// from 0.3, which an outside audit measured as putting 2-5x more variation
// into a bed's local thickness than the whole elapsed-time signal it was
// supposed to sit beside: a 33-minute bed reached 33px somewhere in the frame
// while a two-hour bed dropped to 18px. The swell answers a real complaint
// (015: every band the same idea) and it was drowning the piece's central
// claim. It is texture now rather than the dominant geometry.
const SWELL = 0.15;
const SURFACE_RELIEF = 0.035;  // most relief the sky-facing surface may carry

function boundaryFn(s, W, H, ratio, damp) {
  const rng = mulberry32(s.seed);

  let amp = s.roughness * s.thickness * H * 0.5 * ratio * damp;
  let cycles = 1.2 + rng() * 1.6;

    octaves.push({ f: (cycles * 2 * Math.PI) / waveSpan(H), p: rng() * 2 * Math.PI, a: amp });

  return (x) => octaves.reduce((y, o) => y + Math.sin(x * o.f + o.p) * o.a, 0)

// stratum above it opens with a basal lag: a rough, coarse zone holding
// clasts torn from the layer beneath. The lag is drawn inside the younger
// stratum's own thickness — nothing is subtracted from the older layer.

    cycles *= 2.3;
    amp *= 0.5;
  }

}

// Folding, as episodes. Until stratum 013 the warp was one field whose
// amplitude grew smoothly with depth — which made every deep boundary a
// parallel copy of the one above it, a corduroy rather than a structure.
//
// Rock does not deform continuously. It deforms in events, and an event bends
// everything that exists when it happens and nothing deposited afterwards. So
// the column now carries a deformation episode every FOLD_EVERY strata, each
// with its own independent shape. A layer wears the sum of every episode it
// lived through: the deepest beds have been through them all and are warped by
// a complicated sum, the newest bed has been through none and lies flat.
//
// The effect ramps in over a few strata rather than landing entirely on one
// contact — real deformation distributes through a package, and a hard step
// would read as a fault, which is a different thing and not one that has
// happened here.
const FOLD_EVERY = 6;      // strata between deformation episodes
const FOLD_EPISODE = 0.02; // displacement per episode, fraction of frame height
const FOLD_RAMP = 5;       // strata over which an episode's effect ramps in

function foldField(W, H, seed) {
  const rng = mulberry32((seed ^ 0x5A17F0) >>> 0);
  const octaves = [];
  let amp = 1, cycles = 0.55 + rng() * 0.75;
  for (let k = 0; k < 3; k++) {
    octaves.push({ f: (cycles * 2 * Math.PI) / waveSpan(H), p: rng() * 2 * Math.PI, a: amp });
    cycles *= 1.9;
    amp *= 0.38;
  }
  const norm = octaves.reduce((a, o) => a + o.a, 0);
  return (x) => octaves.reduce((y, o) => y + Math.sin(x * o.f + o.p) * o.a, 0) / norm;
}

// Every horizontal wavelength in this piece is measured against the vertical
// scale, not the window width. Relief amplitude already scales with H, so
// tying wavelength to H too makes every slope invariant: resizing the window
// crops or extends the section instead of stretching it. Both outside readers
// caught the old behaviour — "the same data looks calmer or angrier depending
// on the frame" — which is fatal for something claiming to encode anything.
// 1.6 is the reference aspect, so a landscape window is unchanged.
function waveSpan(H) { return H * 1.6; }

// Exposure. Every bed in this column is protected by the one above it except
// the last, which is the present surface and has nothing on top of it. So the
// newest stratum alone is weathered: its upper boundary is roughened at a
// finer scale than bedding, and lowered by what that removes. The moment a
// successor deposits, this bed is buried and the treatment passes to theirs —
// which is the only mechanism here that *stops* applying to a layer over time.
const EXPOSURE = 0.022;    // weathering depth as a fraction of the frame
const EXPOSURE_CAP = 0.8; // ...but never more than this much of the bed itself

function exposureFn(s, W, H, band) {
  const rng = mulberry32((s.seed + 5) >>> 0);
  const octaves = [];
  // Weathering depth is set by how long the surface has been exposed, not by
  // how thick the topmost bed happens to be. Thickness is the *limit* — you
  // cannot cut past the bed below — and the frame is the *scale*. Until 0064
  // these were the other way round, so `H * 0.022` never once bound in

  // built it, 5.8px by 0064, heading for 2px. The horizon had gone flat.
  let amp = Math.min(H * EXPOSURE, band * EXPOSURE_CAP);
  let cycles = 2.5 + rng() * 3.5;

    octaves.push({ f: (cycles * 2 * Math.PI) / waveSpan(H), p: rng() * 2 * Math.PI, a: amp });
    cycles *= 2.2;
    amp *= 0.45;
  }
  const total = octaves.reduce((a, o) => a + o.a, 0);
  // An envelope, because weathering is not uniform: some stretches of a
  // surface are cut deeply and others are barely touched. Without it the
  // relief is even across the frame and reads as ornament rather than wear.
  const ef = (0.7 + rng() * 0.9) * 2 * Math.PI / waveSpan(H);
  const ep = rng() * 2 * Math.PI;

    const env = 0.3 + 0.7 * (0.5 + 0.5 * Math.sin(x * ef + ep));
    const y = octaves.reduce((v, o) => v + Math.sin(x * o.f + o.p) * o.a, 0);
    // biased downward by its own mean: weathering takes material off rather
    // than piling it on
    return (y * 0.5 + total * 0.5) * env;
  };
}

// Every episode, sampled once per pixel. An episode after stratum n is keyed
// to n, not to a depth, so it keeps affecting exactly the same beds forever as
// the record grows beneath it.
function foldEpisodes(strata, W, H) {
  const amp = FOLD_EPISODE * H;
  const out = [];
  for (let n = FOLD_EVERY; n <= strata.length; n += FOLD_EVERY) {
    const field = foldField(W, H, (strata[0].seed ^ (n * 0x9E37)) >>> 0);

    for (let x = 0; x <= W; x++) samples[x] = field(x) * amp;
    out.push({ n, samples });
  }

  return out;
}

// How much of an episode a given stratum has taken up. 1 for beds well below
// it, 0 for beds deposited after it, smooth in between.
function episodeWeight(n, i) {
  const t = (n - i + 1) / FOLD_RAMP;
  return t <= 0 ? 0 : t >= 1 ? 1 : t * t * (3 - 2 * t);

// a stiff bed folds at long wavelength while a weaker one crumples between its

// and how far its response lags laterally.
const COMPETENCE = 0.3;   // spread in how strongly a bed answers, either side of 1
const LAG = 150;          // furthest a weak bed's response slides sideways, px.

const FAULT_EVERY = 17;   // strata between breaks — rarer than folds by design
const FAULT_THROW = 0.055; // slip, as a fraction of frame height

const FAULT_ZONE = 8;
const FAULT_RAMP = 3;     // strata over which the slip is taken up
const FAULT_MAX = 0.22;   // most of the frame the accumulated throw may stretch

// Rock folds until it cannot, and then it breaks. 0045 measured the fold's
// displacement outgrowing the beds it bends; real columns do not accumulate
// that without limit — past some strain the rock faults instead.
//
// A fault drops the older side and never lifts it. That is not cosmetic:
// everything below the break moves together, and an older bed is always
// dropped at least as far as a younger one, so every gap can only widen. No
// bed can be pushed through its neighbour, whatever the throw — the boundary
// guarantee survives by construction rather than by clamping. The beds
// straddling the break thicken into a wedge, which is what growth strata do.
function faultEpisodes(strata, W, H) {
  const out = [];
  for (let n = FAULT_EVERY; n <= strata.length; n += FAULT_EVERY) {
    const r = mulberry32((strata[0].seed ^ (n * 0x85EB)) >>> 0);
    const at = 0.18 * W + r() * 0.64 * W;      // keep the plane off the edges
    const throwPx = FAULT_THROW * H * (0.6 + r() * 0.8);
    // Polarity alternates rather than being drawn independently. Three
    // independent flips at 0055 all landed the same way, and the section read
    // as one staircase tilting the whole record down-leftward, with the deep
    // beds on that side pushed off the frame. Independent polarity also lets
    // the net throw random-walk without bound — the 0048 failure again.
    // Alternating, the throws cancel pairwise and the result is horst and
    // graben: up-thrown and down-thrown blocks side by side, which is what a
    // conjugate fault set actually makes.
    const downRight = (out.length % 2 === 0);
    const prof = new Float64Array(W + 1);
    for (let x = 0; x <= W; x++) {
      let t = (x - at) / FAULT_ZONE;
      t = t < 0 ? 0 : t > 1 ? 1 : t;
      const k = t * t * (3 - 2 * t);           // the smoothstep the folds use
      prof[x] = throwPx * (downRight ? k : 1 - k);
    }
    out.push({ n, samples: prof });
  }

  // Faults accumulate. Measured at 0048: twenty of them stretch the column by
  // 593px in an 820px frame — the same unbounded-accumulation failure 0045
  // found in the fold, built here one iteration after diagnosing it. So the
  // fault field obeys the rule the column already obeys: it composes the
  // frame. The scaling is uniform and the profiles stay non-negative, so the
  // never-lift guarantee is untouched.
  if (out.length) {
    let worst = 0;
    for (let x = 0; x <= W; x++) {
      let d = 0;
      for (const f of out) d += f.samples[x];
      if (d > worst) worst = d;
    }
    const cap = FAULT_MAX * H;
    if (worst > cap) {
      const k = cap / worst;
      for (const f of out) for (let x = 0; x <= W; x++) f.samples[x] *= k;
    }
  }
  return out;
}

// How far stratum i has been dropped at x. Taken up over FAULT_RAMP strata
// rather than all at once — a fault slips repeatedly, and dumping a whole
// throw into one bed inflates it into a single shapeless mass.
function faultOffset(faults, i, x) {
  let total = 0;
  for (const f of faults) {
    const t = (f.n - i + 1) / FAULT_RAMP;
    if (t <= 0) continue;
    total += t >= 1 ? f.samples[x] : f.samples[x] * t * t * (3 - 2 * t);

}

function competence(s) {
  const c = mulberry32((s.seed + 12) >>> 0);
  // Mapped to the range grain is actually chosen in, not its nominal one.
  // Audited at 042: beds cluster hard around 1.5, so spreading them over the
  // nominal 0.9-2.8 left grain explaining 77% of the variation and a random
  // tie-breaker explaining the rest. Over the real range it explains 92%,

  // should be mostly true, not half true. The jitter stays small so two beds
  // of identical grain still separate instead of folding as one.
  const soft = Math.min(1, Math.max(0, (s.grain - 1.0) / 1.2));  // fine = weak

    amp: 1 + COMPETENCE * (0.5 - soft + jitter),
    lag: Math.round(LAG * (soft - 0.5 + jitter))

  // off the bottom of the frame long before it got interesting.

  // the base carries the same drop as the oldest bed, so the whole faulted
  // block moves as one and nothing below it can be crossed
  for (let x = 0; x <= W; x++) lowerArr[x] = H + sink + floorAt[x] + faultOffset(faults, 1, x);
  let lowerAt = fnOf(lowerArr);
  let prev = null;

  for (let idx = 0; idx < STRATA.length; idx++) {
    const s = STRATA[idx];
    cum += col[idx].h;
    const base = H * (1 - cum) + sink;
    // Relief on a bed scales with its thickness, which is right for a contact
    // between beds and wrong for the one surface facing the sky. Tested at
    // stratum 029 with a synthetic month-long gap: a 197px bed grew 180px of
    // peak-to-trough topography and read as a mountain range. Buried contacts
    // keep their full relief — bedrock's is the best thing in the picture —
    // so this bounds only the exposed surface, and it recovers the moment a
    // successor buries it. Exposure (014) already behaves exactly this way.
    const bedRelief = 0.87 * s.roughness * s.thickness * H * col[idx].ratio
      + s.thickness * col[idx].ratio * H * SWELL;
    const damp = idx === STRATA.length - 1
      ? Math.min(1, (H * SURFACE_RELIEF) / Math.max(1e-6, bedRelief))
      : 1;
    const noise = boundaryFn(s, W, H, col[idx].ratio, damp);
    const weights = episodes.map((e) => episodeWeight(e.n, idx + 1));
    const comp = competence(s);
    const minGap = Math.max(1.2, col[idx].h * H * 0.22);
    const weather = idx === STRATA.length - 1
      ? exposureFn(s, W, H, col[idx].h * H)
      : null;
    const arr = new Float64Array(W + 1);
    for (let x = 0; x <= W; x++) {
      let d = 0;
      const sx = clampAt(x + comp.lag);
      for (let k = 0; k < episodes.length; k++) {
        d += episodes[k].samples[sx] * weights[k] * comp.amp;
      }
      if (weather) d += weather(x);
      d += faultOffset(faults, idx + 1, x);
      arr[x] = Math.min(base + noise(x) + d, lowerArr[x] - minGap);
    }
    const topAt = fnOf(arr);
    topFns.push(topAt);
    const a = altered(s, col[idx].burial, target);

    // band fill
    ctx.beginPath();
    ctx.moveTo(0, topAt(0));
    for (let x = 1; x <= W; x += 2) ctx.lineTo(x, topAt(x));
    for (let x = W; x >= 0; x -= 2) ctx.lineTo(x, lowerAt(x));
    ctx.closePath();
    ctx.fillStyle = `hsl(${a.hue} ${a.sat}% ${a.light}%)`;
    ctx.fill();

    // Grading. A bed is not one flat colour: it settles coarse and dark at
    // the base and fines upward, and that internal structure is most of what
    // makes sediment look like sediment. Drawn as slices that follow the
    // bed's own two boundaries — a single vertical gradient would smear a
    // false shadow across a wavy band. Each slice overlaps the next so no
    // antialiased seam shows; the flat fill above backs them.
    // slice count follows the band's height, so a thick bed grades smoothly
    // instead of contouring and the total work stays proportional to the
    // column rather than to the number of layers
    // Finer steps than before, and each slice boundary wobbles on its own, so
    // the quantisation cannot line up into parallel contours across the bed.
    // Measured at 017: six slices over a 24px bed left 4 RGB units per step,
    // which reads as ruling. Graded bedding is not perfectly parallel anyway.
    // The floor is set by tone, not by pixels. Grading spans 23-31 RGB base
    // to top across the palette, so fewer than ~16 steps puts each step above
    // the ~2 RGB threshold where banding shows — and the old floor of 4 did
    // exactly that. `h*H/2.5` was written when beds were 40px and gave 16
    // slices; at today's 10.9px median it bottomed out on the floor, and
    // grading became a four-band staircase inside every bed. Since 048
    // removed grain, mottling and clasts this is the only interior signal
    // left, and a gradient is the only interior that survives downsampling.
    const slices = Math.max(16, Math.min(32, Math.round(col[idx].h * H / 2.5)));
    const gw = mulberry32((s.seed + 9) >>> 0);
    const band = col[idx].h * H;
    for (let k = 0; k < slices; k++) {
      const wf = (1.5 + gw() * 3) * 2 * Math.PI / waveSpan(H);
      const wp = gw() * 2 * Math.PI;
      const wa = band * 0.012;
      const f0 = k / slices;
      const f1 = k === slices - 1 ? 1 : (k + 1) / slices + 0.02;
      const at = (x, f) => {
        const t = topAt(x);
        return t + (lowerAt(x) - t) * f + (f > 0 && f < 1 ? Math.sin(x * wf + wp) * wa : 0);
      };
      ctx.beginPath();
      ctx.moveTo(0, at(0, f0));
      for (let x = 1; x <= W; x += 2) ctx.lineTo(x, at(x, f0));
      for (let x = W; x >= 0; x -= 2) ctx.lineTo(x, at(x, f1));
      ctx.closePath();
      // The profile is not linear, because settling is not. A graded bed is
      // mostly fine sediment above a thin coarse base, so the tone should hold
      // through the upper bed and fall away near the contact. Centred on zero
      // (the 2/3) so the curve does not shift every bed's mean lightness — an
      // uncentred sqrt profile darkens the whole column by 1.5 units, which is
      // the bias 0056 audited for. See trace/0059.md.
      // named `frac`, not `t`: the arrow function above declares its own `t`
      // for the bed's top, and two shadowing `t`s in nested scopes — the outer
      // declared after the inner is called — is a trap for whoever edits next
      const frac = (k + 0.5) / slices;
      const dl = GRADE_RANGE * (2 / 3 - 2 * frac * frac);
      ctx.fillStyle = `hsl(${a.hue} ${a.sat}% ${a.light + dl}%)`;
      ctx.fill();
    }

    // A diastem — the mark of a wake-up that deposited nothing. `hiatusDays`
    // records time when nobody was awake and leaves a rubble scar; this is the
    // other kind of break, and it needed its own mark because a skipped
    // iteration and a slow one produce exactly the same thicker bed. A mind
    // woke, looked, and laid nothing down: no rubble, because nothing was
    // reworked — just a sharper contact and a shallow scour where the surface
    // sat exposed and unburied for a while.
    if (s.skipped && prev) {
      const dz = Math.min(col[idx].h * H * 0.16, 5) * (1 + 0.35 * (s.skipped - 1));
      const sc = mulberry32((s.seed + 11) >>> 0);
      const f1 = (14 + sc() * 16) * 2 * Math.PI / waveSpan(H);
      const p1 = sc() * 2 * Math.PI;
      const scourTop = (x) => {
        const lo = lowerAt(x), hi = topAt(x) + 1;
        return Math.min(lo, Math.max(hi, lo - dz * (0.55 + 0.45 * Math.sin(x * f1 + p1))));
      };
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(0, scourTop(0));
      for (let x = 1; x <= W; x += 2) ctx.lineTo(x, scourTop(x));
      for (let x = W; x >= 0; x -= 2) ctx.lineTo(x, lowerAt(x));
      ctx.closePath();
      // Deepened at 040. An audit measured ordinary contacts here carrying a
      // median 61 RGB of contrast — they are full hue jumps — while this zone
      // sat at about 15, so the mark meant to say "a mind declined" was the
      // faintest thing in the column. The answer is not a sharper line, since
      // nothing can out-contrast a hue jump: it is to be a different *kind* of
      // contact. Ordinary contacts are lines, a lag is a rubbly zone, and this
      // is a thin clean dark zone with nothing reworked in it.
      ctx.fillStyle = `hsl(${a.hue} ${Math.max(3, a.sat - 8)}% ${Math.max(3, a.light - 18)}%)`;
      ctx.fill();
      ctx.beginPath();          // the surface itself: sharper than any other contact
      ctx.moveTo(0, lowerAt(0));
      for (let x = 1; x <= W; x += 2) ctx.lineTo(x, lowerAt(x));
      ctx.strokeStyle = `hsl(${a.hue} ${a.sat}% ${Math.max(3, a.light - 24)}% / 0.75)`;
      ctx.lineWidth = 1.4;
      ctx.stroke();
      ctx.restore();
    }

    // Lamination. An iteration is not one act — it looks, decides, makes,
    // checks, writes. A bed records how many distinct pieces of work went
    // into it as internal partings. Burial erases them below a few pixels,
    // which is right: fine structure is the first thing lost to compaction,
    // and what survives of an old layer is only that it was there.
    // Gate and spacing were written for 40px beds. At today's 10.5px median no
    // bed passed >= 12 at viewport size, so laminae — the one mechanism
    // carrying iteration-level meaning into the picture, and the one 048
    // deliberately spared *for* that meaning — drew literally nothing where
    // anyone looks: ablating it at 760x460 changed zero pixels. The divisor was
    // as bad: it allowed 2 partings, so a laminae:4 bed and a laminae:3 bed
    // drew the same single line. Now 22 of 46 beds draw one and 18 draw the
    // true count. See trace/0058.md.
    if (s.laminae > 1 && col[idx].h * H >= 6) {
      // A bed can only show as many partings as it has room for. `laminae`
      // stays whatever the iteration honestly counted — the data is not
      // touched — but the view draws what fits: tested at 0034, a count of ten
      // in a 17px bed put a parting every 1.7px, which is the ruling that 017
      // spent an iteration removing. Same principle as the 12px floor above,
      // generalised: below about 3.5px apart they stop being structure.
      // Measured at stratum 017: these were ~20 RGB units of contrast every
      // six pixels, at perfectly even spacing — which is what made a viewer
      // call the interior of the beds "scan lines". Partings in real rock are
      // faint and irregularly spaced. Quieter, and jittered off the grid.
      const lm = mulberry32((s.seed + 8) >>> 0);
      const room = Math.max(2, Math.floor((col[idx].h * H) / 2.2));
      const drawn = Math.min(s.laminae, room);
      ctx.save();
      ctx.lineWidth = 1;
      for (let k = 1; k < drawn; k++) {
        const f = (k + (lm() - 0.5) * 0.45) / drawn;
        ctx.strokeStyle =
          `hsl(${a.hue} ${a.sat}% ${Math.max(3, a.light - 9)}% / ${0.16 + lm() * 0.1})`;
        ctx.beginPath();
        ctx.moveTo(0, topAt(0) + (lowerAt(0) - topAt(0)) * f);
        for (let x = 1; x <= W; x += 2) {
          const t = topAt(x); ctx.lineTo(x, t + (lowerAt(x) - t) * f);
        }
        ctx.stroke();
      }
      ctx.restore();
    }

    // Grain speckle, mottling and clasts were removed at stratum 048.
    // Three texture systems built for a column that had thick beds. The
    // deposition rule made beds permanently thin — the median is now 12px
    // and falling — so by 0050 they moved 0.01%, 0.25% and 0.18% of pixels,
    // and nothing at all at viewport size. Inside a ribbon this thin the
    // only interior signal that survives is a gradient, which is why
    // grading stays and these three do not.
    //
    // The `grain` field survives the cut and is clarified by it: it now
    // means one thing, and a visible one — how stiffly a bed folds.
    // See trace/0050.md and trace/0049-subtraction.md.
    if (s.hiatusDays && prev) {
      const band = col[idx].h * H;
      // also capped in frame terms: on a thick bed the lag was a row of spikes
      const span = Math.min(band * 0.28, band * (0.06 + s.hiatusDays * 0.018),
                            H * 0.03);
      const wob = lagFn(s, W, H, span);
      // kept strictly between this stratum's own top and base: the lag may
      // never break out of the layer that owns it
      const lagTop = (x) => {
        const lo = lowerAt(x), hi = topAt(x) + 2;
        return Math.min(lo, Math.max(hi, lo - span + wob(x)));
      };
      const l = mulberry32(s.seed + 4);
      const pa = altered(prev, col[idx - 1].burial, target);

      ctx.save();
      ctx.beginPath();
      ctx.moveTo(0, lagTop(0));
      for (let x = 1; x <= W; x += 2) ctx.lineTo(x, lagTop(x));
      for (let x = W; x >= 0; x -= 2) ctx.lineTo(x, lowerAt(x));
      ctx.closePath();
      ctx.clip();
      ctx.fillStyle = `hsl(${a.hue} ${Math.max(4, a.sat - 6)}% ${Math.max(4, a.light - 9)}%)`;
      ctx.fill();

      // reworked fragments of the layer below, carried up into this one
      const frags = Math.floor((W / 900) * (70 + l() * 50));
      for (let i = 0; i < frags; i++) {
        const x = l() * W;
        const t = lagTop(x), b = lowerAt(x);
        if (b - t < 2) continue;
        const y = t + l() * (b - t);
        ctx.beginPath();
        ctx.ellipse(x, y, 1.6 + l() * 4.5, 0.9 + l() * 1.8, (l() - 0.5) * 0.9, 0, 2 * Math.PI);
        ctx.fillStyle = `hsl(${pa.hue} ${pa.sat}% ${pa.light + (l() - 0.5) * 16}% / ${0.6 + l() * 0.4})`;
        ctx.fill();
      }
      ctx.restore();

      // the erosional surface itself. It was drawn dashed until stratum 011 —
      // which is the notation of a geological map, not a thing in rock. The
      // lag beneath already says "erosion" in material.
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(0, lagTop(0));
      for (let x = 1; x <= W; x += 2) ctx.lineTo(x, lagTop(x));
      ctx.strokeStyle = `hsl(${a.hue} ${a.sat}% ${Math.max(3, a.light - 20)}% / 0.65)`;
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.restore();
    }

    // Contact line along the top of the layer, thinning with the bed. At a
    // fixed 1px a compacted stratum eventually becomes half boundary — the
    // deep record would turn into a ruled hatch where the strokes carry
    // everything and the rock carries nothing.
    // A contact marks where one bed meets the next. Where this bed has been
    // squeezed to its seam there is no second colour, so a full-strength line
    // is a stain rather than a boundary — a cold reader at 0070 found them
    // "floating with nothing on either side", and 0071 traced it to the stroke
    // weight coming from the bed's *average* height while pinching happens per
    // column. The contact now fades with the room the bed actually has, drawn
    // in runs of constant alpha because a path takes one strokeStyle.
    const cw = Math.max(0.25, Math.min(1, (col[idx].h * H) / 12));
    const hue = `hsl(${a.hue} ${a.sat}% ${Math.max(4, a.light - 12)}%`;
    const lv = new Uint8Array(W + 1);
    for (let x = 0; x <= W; x++) {
      let t = (lowerArr[x] - arr[x] - minGap) / Math.max(1e-6, minGap * 1.6);
      t = t < 0 ? 0 : t > 1 ? 1 : t;
      lv[x] = Math.round(t * t * (3 - 2 * t) * 8);
    }
    ctx.lineWidth = cw;
    for (let run = 0, x = 1; x <= W + 1; x++) {
      if (x > W || lv[x] !== lv[run]) {
        if (lv[run] > 0) {
          ctx.beginPath();
          ctx.moveTo(run, topAt(run));
          for (let k = run + 1; k <= x - 1; k++) ctx.lineTo(k, topAt(k));
          ctx.strokeStyle = `${hue} / ${0.5 * cw * lv[run] / 8})`;
          ctx.stroke();
        }
        run = x;
      }
    }

    // the band currently being read — outlined, never recoloured, so the
    // selection cannot be mistaken for something the stratum itself records
    if (idx === selected) {
      ctx.save();
      ctx.strokeStyle = PALETTES[mode].mark;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(0, topAt(0));
      for (let x = 1; x <= W; x += 2) ctx.lineTo(x, topAt(x));
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, lowerAt(0));
      for (let x = 1; x <= W; x += 2) ctx.lineTo(x, lowerAt(x));
      ctx.stroke();
      ctx.restore();
    }

    lowerArr = arr;
    lowerAt = topAt;
    prev = s;
  }

  const first = STRATA[0], last = STRATA[STRATA.length - 1];
  document.getElementById("meta").textContent =
    `${String(STRATA.length).padStart(3, "0")} ` +
    (STRATA.length === 1 ? "stratum" : "strata") +
    ` · ${first.date}` + (last.date !== first.date ? ` — ${last.date}` : "");
}

const tip = document.getElementById("tip");

function describe(i) {
  const s = STRATA[i];
  const ratio = colInfo[i] ? colInfo[i].compaction : 1;
  return {
    when: `stratum ${String(s.n).padStart(3, "0")} · ${s.date}` +
      (s.hiatusDays ? ` · ${s.hiatusDays}d hiatus beneath` : "") +
      (ratio < 0.99 ? ` · compacted to ${Math.round(ratio * 100)}%` : ""),
    phrase: s.phrase
  };
}

// Every stratum is also real text in the document, youngest first, so the
// record can be read by a screen reader without touching the canvas at all.
function buildRecord() {
  const record = document.getElementById("record");
  record.textContent = "";
  for (let i = STRATA.length - 1; i >= 0; i--) {
    const li = document.createElement("li");
    const d = describe(i);
    li.textContent = `${d.when}. ${d.phrase}`;
    record.appendChild(li);
  }
}

function showTip(i, x, y) {
  const d = describe(i);
  // built as nodes, not interpolated into innerHTML: a phrase is free text and
  // may one day contain `<` or `&`. None has in sixty-one strata, so nothing
  // broke and nothing would have told us — the record is the only content this
  // piece has, and it should not have to avoid characters. `buildRecord` has
  // always used textContent; this is the same rule applied to the tooltip.
  tip.textContent = "";
  const when = document.createElement("div");
  when.className = "when";
  when.textContent = d.when;
  const line = document.createElement("div");
  line.textContent = d.phrase;
  tip.append(when, line);
  tip.style.visibility = "visible";
  const pad = 14;
  tip.style.left = Math.min(Math.max(pad, x), innerWidth - tip.offsetWidth - pad) + "px";
  tip.style.top = Math.max(pad, Math.min(y, innerHeight - tip.offsetHeight - pad)) + "px";
}

function hideTip() { tip.style.visibility = "hidden"; }

function select(i) {
  const prev = selected;
  selected = Math.max(0, Math.min(STRATA.length - 1, i));
  if (prev !== selected) render();
  // place the readout beside the band itself, since there is no pointer to
  // anchor it to; thin beds are common, so clamp into the viewport
  const cx = innerWidth / 2;
  const top = topFns[selected](cx);
  const bot = selected > 0 ? topFns[selected - 1](cx) : innerHeight;
  showTip(selected, 20, Math.min(top, innerHeight - 60) + Math.min(24, (bot - top) / 2));
}

function clearSelection() {
  if (selected !== -1) { selected = -1; render(); }
  hideTip();
}

canvas.addEventListener("pointermove", (e) => {
  const x = e.clientX, y = e.clientY;
  let hitIdx = -1;
  for (let i = STRATA.length - 1; i >= 0; i--) {
    if (y >= topFns[i](x)) { hitIdx = i; break; }
  }
  if (hitIdx < 0) { clearSelection(); return; }
  if (hitIdx !== selected) { selected = hitIdx; render(); }
  const pad = 14;
  showTip(hitIdx, x + pad, y + pad);
});
canvas.addEventListener("pointerleave", clearSelection);

canvas.addEventListener("keydown", (e) => {
  const last = STRATA.length - 1;
  switch (e.key) {
    // up the screen is up the column: toward the youngest layer
    case "ArrowUp": case "ArrowRight":
      select(selected < 0 ? last : selected + 1); break;
    case "ArrowDown": case "ArrowLeft":
      select(selected < 0 ? last : selected - 1); break;
    case "Home": select(last); break;   // the surface, most recent
    case "End": select(0); break;       // bedrock
    case "Escape": clearSelection(); return;
    default: return;
  }
  e.preventDefault();
});
canvas.addEventListener("blur", clearSelection);

let raf = 0;
const queue = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(render); };
addEventListener("resize", queue);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", queue);
new MutationObserver(queue).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

render();
buildRecord();
</script>
