function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const PALETTES = {
  light: { ground: "#EDE7DA", mark: "#3A342B" },
  dark: { ground: "#100E0B", mark: "#C9BFAE" }
};

function theme() {
  const forced = document.documentElement.getAttribute("data-theme");
  if (forced === "dark" || forced === "light") return forced;
  return matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}

const canvas = document.getElementById("core");
const ctx = canvas.getContext("2d");
let topFns = []; // per stratum: top-boundary function in CSS px, for hit-testing
let colInfo = []; // per stratum: { h, ratio } — how far burial has squeezed it
let selected = -1; // index of the stratum being read, or -1

// Compaction. The column must fit a frame that does not grow, so as strata
// accumulate the deepest ones are squeezed by the weight above them. No
// stratum's data ever changes — only how tightly the record is pressed.
// A layer's boundary keeps its exact shape; it is flattened, not redrawn.
const COMPACTION = 0.9;  // how hard burial squeezes
// The margin above the column is a margin, not a promise. Two outside viewers
// read the old 25-30% of empty ground as unfinished — "an unfilled progress
// bar", "it looks like it slumped to the bottom of its own frame" — and one
// noted the ambiguity exactly: either that space means "this has not happened
// yet", or it is nothing. It cannot mean the future, because the column
// asymptotes and the gap never closes. So it is sized to read as framing.
const FILL_MIN = 0.72;   // even one layer composes the frame
const FILL_MAX = 0.95;   // asymptote — the frame never quite fills
const FILL_RATE = 0.7;   // how fast the column grows into the margin

function column(strata) {
  const raw = strata.map((s) => s.thickness);
  const total = raw.reduce((a, b) => a + b, 0);
  const burial = [];
  let acc = 0;
  for (let i = raw.length - 1; i >= 0; i--) { burial[i] = acc; acc += raw[i]; }
  const squeezed = raw.map((t, i) => t / (1 + COMPACTION * burial[i]));
  const buried = burial;
  const sum = squeezed.reduce((a, b) => a + b, 0) || 1;
  // The column is always composed into the frame: empty space above it is a
  // margin, not an unfinished progress bar. Early on that means drawing the
  // section larger than life; the scale falls below 1 as the record grows.
  const fill = FILL_MIN + (FILL_MAX - FILL_MIN) * (1 - Math.exp(-total / FILL_RATE));
  const scale = fill / sum;
  const out = raw.map((t, i) => {
    const h = squeezed[i] * scale;
    return {
      h,
      ratio: h / t,                              // display scale, for geometry
      compaction: 1 / (1 + COMPACTION * buried[i]),  // physical, for the readout
      burial: buried[i],
      depth: 0
    };
  });
  // depth: how much *rendered* column lies above a layer. Compaction and
  // diagenesis key off raw burial, but anything that displaces geometry must
  // use on-screen depth, or a heavily compacted layer gets shoved through the
  // one above it.
  let d = 0;
  for (let i = out.length - 1; i >= 0; i--) { out[i].depth = d; d += out[i].h; }
  out.fill = d;
  return out;
}

// Diagenesis. Burial does not only squeeze a layer, it alters it: with depth
// the sediment loses its distinctness and drifts toward a common tone. The
// record does not disappear — the cap keeps every layer legible — but the deep
// past reads as one substrate rather than as a stack of separate decisions.
//
// The target differs by theme, and this is the one real design decision the
// dark rendering has. A target near the ground would make old layers dissolve
// into the void instead of merging with each other. Against pale ground the
// column darkens as it sinks; against dark ground it settles toward a middle
// tone that still stands clear of the background. Both unify; neither erases.
const DIAGENESIS = {
  light: { hue: 28, sat: 9, light: 20 },
  dark: { hue: 28, sat: 11, light: 34 },
  k: 0.7, max: 0.82
};

// how a single bed grades internally, from its base to its top
const GRADE_RANGE = 4.5;  // lightness units, base to top

function altered(s, burial, target) {
  const d = Math.min(DIAGENESIS.max, burial / (burial + DIAGENESIS.k));
  const dh = ((target.hue - s.hue + 540) % 360) - 180; // shortest way round
  return {
    hue: s.hue + dh * d,
    sat: s.sat + (target.sat - s.sat) * d,
    light: s.light + (target.light - s.light) * d,
    d
  };
}

// A bed's top surface: fine relief from bedding, plus one long swell that is
// the bed's own. Deposition is not uniform across a basin — a bed thickens
// where more settled and thins to a seam where less did. Without this every
// boundary rides the shared fold in parallel and the column reads as a chart
// of even ribbons: same idea, different colour, fifteen times. The swell is
// what makes one bed differ from its neighbour rather than merely follow it.
const SWELL = 0.3;  // lateral thickness variation, as a fraction of the bed

function boundaryFn(s, W, H, ratio) {
  const rng = mulberry32(s.seed);
  const octaves = [];
  const damp = 1;
  let amp = s.roughness * s.thickness * H * 0.5 * ratio * damp;
  let cycles = 1.2 + rng() * 1.6;
  for (let k = 0; k < 4; k++) {
    octaves.push({ f: (cycles * 2 * Math.PI) / waveSpan(H), p: rng() * 2 * Math.PI, a: amp });
    cycles *= 2.1;
    amp *= 0.45;
  }
  const sw = mulberry32((s.seed + 6) >>> 0);
  const swellAmp = s.thickness * ratio * H * SWELL * damp;
  const swellF = (0.8 + sw() * 1.7) * 2 * Math.PI / waveSpan(H);
  const swellP = sw() * 2 * Math.PI;
  return (x) => octaves.reduce((y, o) => y + Math.sin(x * o.f + o.p) * o.a, 0)
    + Math.sin(x * swellF + swellP) * swellAmp;
}

// A gap in deposition. Real time passed with no iteration awake, so the
// stratum above it opens with a basal lag: a rough, coarse zone holding
// clasts torn from the layer beneath. The lag is drawn inside the younger
// stratum's own thickness — nothing is subtracted from the older layer.
function lagFn(s, W, H, span) {
  const u = mulberry32(s.seed + 3);
  const octaves = [];
  let amp = span * 0.34;
  let cycles = 9 + u() * 10;
  for (let k = 0; k < 3; k++) {
    octaves.push({ f: (cycles * 2 * Math.PI) / waveSpan(H), p: u() * 2 * Math.PI, a: amp });
    cycles *= 2.3;
    amp *= 0.5;
  }
  return (x) => octaves.reduce((y, o) => y + Math.sin(x * o.f + o.p) * o.a, 0);
}

// Folding, as episodes. Until stratum 013 the warp was one field whose
// amplitude grew smoothly with depth — which made every deep boundary a
// parallel copy of the one above it, a corduroy rather than a structure.
//
// Rock does not deform continuously. It deforms in events, and an event bends
// everything that exists when it happens and nothing deposited afterwards. So
// the column now carries a deformation episode every FOLD_EVERY strata, each
// with its own independent shape. A layer wears the sum of every episode it
// lived through: the deepest beds have been through them all and are warped by
// a complicated sum, the newest bed has been through none and lies flat.
//
// The effect ramps in over a few strata rather than landing entirely on one
// contact — real deformation distributes through a package, and a hard step
// would read as a fault, which is a different thing and not one that has
// happened here.
const FOLD_EVERY = 6;      // strata between deformation episodes
const FOLD_EPISODE = 0.02; // displacement per episode, fraction of frame height
const FOLD_RAMP = 5;       // strata over which an episode's effect ramps in

function foldField(W, H, seed) {
  const rng = mulberry32((seed ^ 0x5A17F0) >>> 0);
  const octaves = [];
  let amp = 1, cycles = 0.55 + rng() * 0.75;
  for (let k = 0; k < 3; k++) {
    octaves.push({ f: (cycles * 2 * Math.PI) / waveSpan(H), p: rng() * 2 * Math.PI, a: amp });
    cycles *= 1.9;
    amp *= 0.38;
  }
  const norm = octaves.reduce((a, o) => a + o.a, 0);
  return (x) => octaves.reduce((y, o) => y + Math.sin(x * o.f + o.p) * o.a, 0) / norm;
}

// Every horizontal wavelength in this piece is measured against the vertical
// scale, not the window width. Relief amplitude already scales with H, so
// tying wavelength to H too makes every slope invariant: resizing the window
// crops or extends the section instead of stretching it. Both outside readers
// caught the old behaviour — "the same data looks calmer or angrier depending
// on the frame" — which is fatal for something claiming to encode anything.
// 1.6 is the reference aspect, so a landscape window is unchanged.
function waveSpan(H) { return H * 1.6; }

// Exposure. Every bed in this column is protected by the one above it except
// the last, which is the present surface and has nothing on top of it. So the
// newest stratum alone is weathered: its upper boundary is roughened at a
// finer scale than bedding, and lowered by what that removes. The moment a
// successor deposits, this bed is buried and the treatment passes to theirs —
// which is the only mechanism here that *stops* applying to a layer over time.
const EXPOSURE = 0.3;  // fraction of the bed's own height that weathers away

function exposureFn(s, W, H, band) {
  const rng = mulberry32((s.seed + 5) >>> 0);
  const octaves = [];
  let amp = Math.min(band * EXPOSURE, H * 0.022);
  let cycles = 2.5 + rng() * 3.5;
  for (let k = 0; k < 3; k++) {
    octaves.push({ f: (cycles * 2 * Math.PI) / waveSpan(H), p: rng() * 2 * Math.PI, a: amp });
    cycles *= 2.2;
    amp *= 0.45;
  }
  const total = octaves.reduce((a, o) => a + o.a, 0);
  // An envelope, because weathering is not uniform: some stretches of a
  // surface are cut deeply and others are barely touched. Without it the
  // relief is even across the frame and reads as ornament rather than wear.
  const ef = (0.7 + rng() * 0.9) * 2 * Math.PI / waveSpan(H);
  const ep = rng() * 2 * Math.PI;
  return (x) => {
    const env = 0.3 + 0.7 * (0.5 + 0.5 * Math.sin(x * ef + ep));
    const y = octaves.reduce((v, o) => v + Math.sin(x * o.f + o.p) * o.a, 0);
    // biased downward by its own mean: weathering takes material off rather
    // than piling it on
    return (y * 0.5 + total * 0.5) * env;
  };
}

// Every episode, sampled once per pixel. An episode after stratum n is keyed
// to n, not to a depth, so it keeps affecting exactly the same beds forever as
// the record grows beneath it.
function foldEpisodes(strata, W, H) {
  const amp = FOLD_EPISODE * H;
  const out = [];
  for (let n = FOLD_EVERY; n <= strata.length; n += FOLD_EVERY) {
    const field = foldField(W, H, (strata[0].seed ^ (n * 0x9E37)) >>> 0);
    const samples = new Float64Array(W + 1);
    for (let x = 0; x <= W; x++) samples[x] = field(x) * amp;
    out.push({ n, samples });
  }
  out.amp = amp;
  return out;
}

// How much of an episode a given stratum has taken up. 1 for beds well below
// it, 0 for beds deposited after it, smooth in between.
function episodeWeight(n, i) {
  const t = (n - i + 1) / FOLD_RAMP;
  return t <= 0 ? 0 : t >= 1 ? 1 : t * t * (3 - 2 * t);
}

function render() {
  const dpr = devicePixelRatio || 1;
  const W = innerWidth, H = innerHeight;
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const mode = theme();
  const target = DIAGENESIS[mode];
  ctx.fillStyle = PALETTES[mode].ground;
  ctx.fillRect(0, 0, W, H);

  topFns = [];
  const col = column(STRATA);
  colInfo = col;
  let cum = 0;
  // the fold carries the whole column down by its own deepest displacement,
  // so the floor of the section never rises into view — the piece runs off
  // the bottom edge, the way a real exposure does
  const episodes = foldEpisodes(STRATA, W, H);
  // The floor takes every episode at full strength. The column is carried down
  // by however far that actually lifts it — measured, not bounded: episodes
  // have independent phases, so their sum grows roughly with the square root
  // of their number, and assuming the worst case would push the whole record
  // off the bottom of the frame long before it got interesting.
  const floorAt = new Float64Array(W + 1);
  let sink = 0;
  for (let x = 0; x <= W; x++) {
    let d = 0;
    for (const e of episodes) d += e.samples[x];
    floorAt[x] = d;
    if (-d > sink) sink = -d;
  }

  // Boundaries are sampled once per pixel rather than evaluated as nested
  // closures. That makes the clamp below possible in linear time, and it is
  // what keeps a thin bed from being punched through by the relief of a
  // thicker, rougher one underneath it: no boundary may come closer than a
  // fraction of its own band to the boundary below. Where the fold or the
  // relief would squeeze a layer out of existence it pinches to a seam
  // instead — which is what beds actually do.
  const clampAt = (x) => (x < 0 ? 0 : x > W ? W : x);
  const fnOf = (arr) => (x) => arr[clampAt(Math.round(x))];

  let lowerArr = new Float64Array(W + 1);
  for (let x = 0; x <= W; x++) lowerArr[x] = H + sink + floorAt[x];
  let lowerAt = fnOf(lowerArr);
  let prev = null;

  for (let idx = 0; idx < STRATA.length; idx++) {
    const s = STRATA[idx];
    cum += col[idx].h;
    const base = H * (1 - cum) + sink;
    const noise = boundaryFn(s, W, H, col[idx].ratio);
    const weights = episodes.map((e) => episodeWeight(e.n, idx + 1));
    const minGap = Math.max(1.2, col[idx].h * H * 0.22);
    const weather = idx === STRATA.length - 1
      ? exposureFn(s, W, H, col[idx].h * H)
      : null;
    const arr = new Float64Array(W + 1);
    for (let x = 0; x <= W; x++) {
      let d = 0;
      for (let k = 0; k < episodes.length; k++) d += episodes[k].samples[x] * weights[k];
      if (weather) d += weather(x);
      arr[x] = Math.min(base + noise(x) + d, lowerArr[x] - minGap);
    }
    const topAt = fnOf(arr);
    topFns.push(topAt);
    const a = altered(s, col[idx].burial, target);

    // band fill
    ctx.beginPath();
    ctx.moveTo(0, topAt(0));
    for (let x = 1; x <= W; x += 2) ctx.lineTo(x, topAt(x));
    for (let x = W; x >= 0; x -= 2) ctx.lineTo(x, lowerAt(x));
    ctx.closePath();
    ctx.fillStyle = `hsl(${a.hue} ${a.sat}% ${a.light}%)`;
    ctx.fill();

    // Grading. A bed is not one flat colour: it settles coarse and dark at
    // the base and fines upward, and that internal structure is most of what
    // makes sediment look like sediment. Drawn as slices that follow the
    // bed's own two boundaries — a single vertical gradient would smear a
    // false shadow across a wavy band. Each slice overlaps the next so no
    // antialiased seam shows; the flat fill above backs them.
    // slice count follows the band's height, so a thick bed grades smoothly
    // instead of contouring and the total work stays proportional to the
    // column rather than to the number of layers
    // Finer steps than before, and each slice boundary wobbles on its own, so
    // the quantisation cannot line up into parallel contours across the bed.
    // Measured at 017: six slices over a 24px bed left 4 RGB units per step,
    // which reads as ruling. Graded bedding is not perfectly parallel anyway.
    const slices = Math.max(4, Math.min(32, Math.round(col[idx].h * H / 2.5)));
    const gw = mulberry32((s.seed + 9) >>> 0);
    const band = col[idx].h * H;
    for (let k = 0; k < slices; k++) {
      const wf = (1.5 + gw() * 3) * 2 * Math.PI / waveSpan(H);
      const wp = gw() * 2 * Math.PI;
      const wa = band * 0.012;
      const f0 = k / slices;
      const f1 = k === slices - 1 ? 1 : (k + 1) / slices + 0.02;
      const at = (x, f) => {
        const t = topAt(x);
        return t + (lowerAt(x) - t) * f + (f > 0 && f < 1 ? Math.sin(x * wf + wp) * wa : 0);
      };
      ctx.beginPath();
      ctx.moveTo(0, at(0, f0));
      for (let x = 1; x <= W; x += 2) ctx.lineTo(x, at(x, f0));
      for (let x = W; x >= 0; x -= 2) ctx.lineTo(x, at(x, f1));
      ctx.closePath();
      const dl = GRADE_RANGE * (1 - 2 * ((k + 0.5) / slices));
      ctx.fillStyle = `hsl(${a.hue} ${a.sat}% ${a.light + dl}%)`;
      ctx.fill();
    }

    // Lamination. An iteration is not one act — it looks, decides, makes,
    // checks, writes. A bed records how many distinct pieces of work went
    // into it as internal partings. Burial erases them below a few pixels,
    // which is right: fine structure is the first thing lost to compaction,
    // and what survives of an old layer is only that it was there.
    if (s.laminae > 1 && col[idx].h * H >= 12) {
      // Measured at stratum 017: these were ~20 RGB units of contrast every
      // six pixels, at perfectly even spacing — which is what made a viewer
      // call the interior of the beds "scan lines". Partings in real rock are
      // faint and irregularly spaced. Quieter, and jittered off the grid.
      const lm = mulberry32((s.seed + 8) >>> 0);
      ctx.save();
      ctx.lineWidth = 1;
      for (let k = 1; k < s.laminae; k++) {
        const f = (k + (lm() - 0.5) * 0.45) / s.laminae;
        ctx.strokeStyle =
          `hsl(${a.hue} ${a.sat}% ${Math.max(3, a.light - 9)}% / ${0.16 + lm() * 0.1})`;
        ctx.beginPath();
        ctx.moveTo(0, topAt(0) + (lowerAt(0) - topAt(0)) * f);
        for (let x = 1; x <= W; x += 2) {
          const t = topAt(x); ctx.lineTo(x, t + (lowerAt(x) - t) * f);
        }
        ctx.stroke();
      }
      ctx.restore();
    }

    // grain
    const g = mulberry32(s.seed + 1);
    const ge = mulberry32((s.seed + 10) >>> 0);
    const grainF = (1.1 + ge() * 1.8) * 2 * Math.PI / waveSpan(H);
    const grainP = ge() * 2 * Math.PI;
    // compaction concentrates the grain as it thins the band
    const count = Math.floor((s.grain * col[idx].h * H * W) / 900 / Math.sqrt(col[idx].ratio));
    for (let i = 0; i < count; i++) {
      const x = g() * W;
      const t = topAt(x), b = lowerAt(x);
      if (b <= t) continue;
      const y = t + g() * (b - t);
      const dl = (g() - 0.5) * 20;
      // Grain clusters. It had been an even sprinkle at one density in every
      // bed, which reads as noise laid over the picture rather than as
      // material in it — sediment is patchy at every scale, not just the one
      // mottling works at. The envelope is slow across the section, so grain
      // gathers in some stretches and thins in others.
      const env = 0.25 + 0.75 * (0.5 + 0.5 * Math.sin(x * grainF + grainP));
      ctx.fillStyle = `hsl(${a.hue} ${a.sat}% ${a.light + dl}% / ${(0.04 + g() * 0.18) * env})`;
      const r = 0.8 + g() * 1.6;
      ctx.fillRect(x, y, r, r);
    }

    // unconformity — a basal lag marking days when nothing was deposited
    if (s.hiatusDays && prev) {
      const band = col[idx].h * H;
      const span = Math.min(band * 0.28, band * (0.06 + s.hiatusDays * 0.018));
      const wob = lagFn(s, W, H, span);
      // kept strictly between this stratum's own top and base: the lag may
      // never break out of the layer that owns it
      const lagTop = (x) => {
        const lo = lowerAt(x), hi = topAt(x) + 2;
        return Math.min(lo, Math.max(hi, lo - span + wob(x)));
      };
      const l = mulberry32(s.seed + 4);
      const pa = altered(prev, col[idx - 1].burial, target);

      ctx.save();
      ctx.beginPath();
      ctx.moveTo(0, lagTop(0));
      for (let x = 1; x <= W; x += 2) ctx.lineTo(x, lagTop(x));
      for (let x = W; x >= 0; x -= 2) ctx.lineTo(x, lowerAt(x));
      ctx.closePath();
      ctx.clip();
      ctx.fillStyle = `hsl(${a.hue} ${Math.max(4, a.sat - 6)}% ${Math.max(4, a.light - 9)}%)`;
      ctx.fill();

      // reworked fragments of the layer below, carried up into this one
      const frags = Math.floor((W / 900) * (70 + l() * 50));
      for (let i = 0; i < frags; i++) {
        const x = l() * W;
        const t = lagTop(x), b = lowerAt(x);
        if (b - t < 2) continue;
        const y = t + l() * (b - t);
        ctx.beginPath();
        ctx.ellipse(x, y, 1.6 + l() * 4.5, 0.9 + l() * 1.8, (l() - 0.5) * 0.9, 0, 2 * Math.PI);
        ctx.fillStyle = `hsl(${pa.hue} ${pa.sat}% ${pa.light + (l() - 0.5) * 16}% / ${0.6 + l() * 0.4})`;
        ctx.fill();
      }
      ctx.restore();

      // the erosional surface itself. It was drawn dashed until stratum 011 —
      // which is the notation of a geological map, not a thing in rock. The
      // lag beneath already says "erosion" in material.
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(0, lagTop(0));
      for (let x = 1; x <= W; x += 2) ctx.lineTo(x, lagTop(x));
      ctx.strokeStyle = `hsl(${a.hue} ${a.sat}% ${Math.max(3, a.light - 20)}% / 0.65)`;
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.restore();
    }

    // Mottling. A large mass of rock is never one tone — it is patchy at a
    // scale far bigger than its grain. The piece had been spending its whole
    // detail budget on the thin beds, where grain and laminae and grading all
    // read, and leaving the thick ones flat enough to look like backing paper.
    // Patches are sized to the band, so a thick bed gets broad tonal variation
    // and a hairline gets nothing, which is the correction that was needed.
    const mo = mulberry32(s.seed + 7);
    const mottles = Math.round((col[idx].h * H * W) / 17000);
    ctx.save();
    ctx.beginPath();          // clipped to the band: a patch belongs to its bed
    ctx.moveTo(0, topAt(0));
    for (let x = 1; x <= W; x += 2) ctx.lineTo(x, topAt(x));
    for (let x = W; x >= 0; x -= 2) ctx.lineTo(x, lowerAt(x));
    ctx.closePath();
    ctx.clip();
    for (let i = 0; i < mottles; i++) {
      const bx = mo() * W;
      const t = topAt(bx), b = lowerAt(bx);
      if (b - t < 6) { mo(); mo(); mo(); continue; }
      const band = b - t;
      const by = t + mo() * band;
      ctx.beginPath();
      ctx.ellipse(bx, by, band * (1.5 + mo() * 2.5), band * (0.25 + mo() * 0.3),
                  0, 0, 2 * Math.PI);
      ctx.fillStyle = `hsl(${a.hue} ${a.sat}% ${a.light + (mo() - 0.5) * 26}% / 0.13)`;
      ctx.fill();
    }
    ctx.restore();

    // Clasts — the coarse fraction, where grain is the fine one. Until 012
    // this was two to five ellipses per bed regardless of how much bed there
    // was: at any real width that is three smudges, not a texture. The count
    // is a density now, and their size follows the band, so a thin bed gets
    // small ones rather than none.
    const c = mulberry32(s.seed + 2);
    const bandPx = Math.max(1, col[idx].h * H);
    const clasts = Math.round((bandPx * W) / 3500);
    const scale = Math.min(1, bandPx / 26);
    for (let i = 0; i < clasts; i++) {
      const x = c() * W;
      const t = topAt(x), b = lowerAt(x);
      const inset = Math.min(3, (b - t) * 0.18);
      if (b - t < 2.5) { c(); c(); c(); c(); continue; }
      const y = t + inset + c() * (b - t - 2 * inset);
      ctx.beginPath();
      ctx.ellipse(x, y, (1.4 + c() * 4) * scale, (0.8 + c() * 2.2) * scale,
                  (c() - 0.5) * 1.2, 0, 2 * Math.PI);
      ctx.fillStyle = `hsl(${a.hue} ${a.sat}% ${Math.max(4, a.light - 14)}% / 0.3)`;
      ctx.fill();
    }

    // Contact line along the top of the layer, thinning with the bed. At a
    // fixed 1px a compacted stratum eventually becomes half boundary — the
    // deep record would turn into a ruled hatch where the strokes carry
    // everything and the rock carries nothing.
    const cw = Math.max(0.25, Math.min(1, (col[idx].h * H) / 12));
    ctx.beginPath();
    ctx.moveTo(0, topAt(0));
    for (let x = 1; x <= W; x += 2) ctx.lineTo(x, topAt(x));
    ctx.strokeStyle = `hsl(${a.hue} ${a.sat}% ${Math.max(4, a.light - 12)}% / ${0.5 * cw})`;
    ctx.lineWidth = cw;
    ctx.stroke();

    // the band currently being read — outlined, never recoloured, so the
    // selection cannot be mistaken for something the stratum itself records
    if (idx === selected) {
      ctx.save();
      ctx.strokeStyle = PALETTES[mode].mark;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(0, topAt(0));
      for (let x = 1; x <= W; x += 2) ctx.lineTo(x, topAt(x));
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, lowerAt(0));
      for (let x = 1; x <= W; x += 2) ctx.lineTo(x, lowerAt(x));
      ctx.stroke();
      ctx.restore();
    }

    lowerArr = arr;
    lowerAt = topAt;
    prev = s;
  }

  const first = STRATA[0], last = STRATA[STRATA.length - 1];
  document.getElementById("meta").textContent =
    `${String(STRATA.length).padStart(3, "0")} ` +
    (STRATA.length === 1 ? "stratum" : "strata") +
    ` · ${first.date}` + (last.date !== first.date ? ` — ${last.date}` : "");
}

const tip = document.getElementById("tip");

function describe(i) {
  const s = STRATA[i];
  const ratio = colInfo[i] ? colInfo[i].compaction : 1;
  return {
    when: `stratum ${String(s.n).padStart(3, "0")} · ${s.date}` +
      (s.hiatusDays ? ` · ${s.hiatusDays}d hiatus beneath` : "") +
      (ratio < 0.99 ? ` · compacted to ${Math.round(ratio * 100)}%` : ""),
    phrase: s.phrase
  };
}

// Every stratum is also real text in the document, youngest first, so the
// record can be read by a screen reader without touching the canvas at all.
function buildRecord() {
  const record = document.getElementById("record");
  record.textContent = "";
  for (let i = STRATA.length - 1; i >= 0; i--) {
    const li = document.createElement("li");
    const d = describe(i);
    li.textContent = `${d.when}. ${d.phrase}`;
    record.appendChild(li);
  }
}

function showTip(i, x, y) {
  const d = describe(i);
  tip.innerHTML = `<div class="when">${d.when}</div><div>${d.phrase}</div>`;
  tip.style.visibility = "visible";
  const pad = 14;
  tip.style.left = Math.min(Math.max(pad, x), innerWidth - tip.offsetWidth - pad) + "px";
  tip.style.top = Math.max(pad, Math.min(y, innerHeight - tip.offsetHeight - pad)) + "px";
}

function hideTip() { tip.style.visibility = "hidden"; }

function select(i) {
  const prev = selected;
  selected = Math.max(0, Math.min(STRATA.length - 1, i));
  if (prev !== selected) render();
  // place the readout beside the band itself, since there is no pointer to
  // anchor it to; thin beds are common, so clamp into the viewport
  const cx = innerWidth / 2;
  const top = topFns[selected](cx);
  const bot = selected > 0 ? topFns[selected - 1](cx) : innerHeight;
  showTip(selected, 20, Math.min(top, innerHeight - 60) + Math.min(24, (bot - top) / 2));
}

function clearSelection() {
  if (selected !== -1) { selected = -1; render(); }
  hideTip();
}

canvas.addEventListener("pointermove", (e) => {
  const x = e.clientX, y = e.clientY;
  let hitIdx = -1;
  for (let i = STRATA.length - 1; i >= 0; i--) {
    if (y >= topFns[i](x)) { hitIdx = i; break; }
  }
  if (hitIdx < 0) { clearSelection(); return; }
  if (hitIdx !== selected) { selected = hitIdx; render(); }
  const pad = 14;
  showTip(hitIdx, x + pad, y + pad);
});
canvas.addEventListener("pointerleave", clearSelection);

canvas.addEventListener("keydown", (e) => {
  const last = STRATA.length - 1;
  switch (e.key) {
    // up the screen is up the column: toward the youngest layer
    case "ArrowUp": case "ArrowRight":
      select(selected < 0 ? last : selected + 1); break;
    case "ArrowDown": case "ArrowLeft":
      select(selected < 0 ? last : selected - 1); break;
    case "Home": select(last); break;   // the surface, most recent
    case "End": select(0); break;       // bedrock
    case "Escape": clearSelection(); return;
    default: return;
  }
  e.preventDefault();
});
canvas.addEventListener("blur", clearSelection);

let raf = 0;
const queue = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(render); };
addEventListener("resize", queue);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", queue);
new MutationObserver(queue).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

render();
buildRecord();
</script>
